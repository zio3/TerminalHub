<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Terminal snapshot</title>
<!--
  ターミナル表示の固定ビューア。
  本体の右上「この表示を別ウィンドウで固定」ボタンから開かれ、GET /api/terminal/{GUID}/snapshot で
  その瞬間のエミュレータ内容（スクロールバック込みの ANSI）を 1 回だけ取得して読み取り専用の xterm に流し込む。
  以後は一切更新しないので、本体がいくら進んでもここは固定のまま（一覧や表を見ながら作業を進める用途）。

  列数は取得時のままに固定する（折り返し直しをすると表の見た目が変わるため）。ウィンドウが狭ければ横スクロール。
  行数だけはウィンドウの高さに合わせる（行数の変更は内容を折り返し直さない）。
  本体と同じ xterm バージョン・フォント・テーマ・Unicode11(VS16) で開く。WebGL は使わない
  （静的表示には不要で、本体側の WebGL コンテキスト上限を食わないため）。

  本体のスクロール位置（scrollUp=最下行から遡った行数）とマウス選択範囲（sel=開始列,開始行,終了列,終了行。
  行はバッファ末尾からの行数）を URL で受け取り、流し込みと行数合わせが済んだあとに再現する。
  末尾からの行数で受けるのは、こちらの行数（rows）がウィンドウ高さで変わり先頭からの絶対行がずれるため。
  それでも本体と行がずれるケース（列数変更で本体だけ履歴を折り返し直している、クリックから取得までに出力が進んだ）が
  あるので、先頭表示行と選択開始行のテキスト（top / selText）も受け取り、計算位置の近傍で一致する行を探して補正する。
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/css/xterm.css" />
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.11.0/lib/addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-unicode11@0.9.0/lib/addon-unicode11.js"></script>
<script src="js/unicode-vs16.js"></script>
<style>
  /* 本体 app.css の合成フォント TermMix と同じ定義（このページは app.css を読まない） */
  @font-face {
    font-family: 'TermMix';
    src: local('Cascadia Mono'), local('Consolas');
  }
  @font-face {
    font-family: 'TermMix';
    src: local('Segoe UI Symbol'), local('Yu Gothic UI'), local('Meiryo UI'), local('BIZ UDGothic');
    unicode-range: U+2460-24FF, U+3200-32FF;
  }
  html, body { height: 100%; margin: 0; }
  body { background: #1e1e1e; color: #d4d4d4; font-family: 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
  #bar { flex: 0 0 auto; display: flex; gap: 12px; align-items: baseline; padding: 4px 10px; font-size: 12px; color: #9a9a9a; background: #252526; border-bottom: 1px solid #333; white-space: nowrap; overflow: hidden; }
  #name { color: #d4d4d4; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  #term { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 4px 0 0 4px; }
  #msg { padding: 16px; font-size: 14px; }
  .err { color: #f14c4c; }
</style>
</head>
<body>
<div id="bar"><span id="name"></span><span id="when"></span><span id="size"></span></div>
<div id="term"></div>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const sessionId = params.get('session') || '';
  const fontSize = Math.max(8, Math.min(32, parseInt(params.get('fontSize') || '14', 10) || 14));
  // 数値パラメータは 10 進の非負整数そのものだけを受け付ける（"10junk" のような部分一致は無視。Codex レビュー P3）
  const uint = (s) => (/^\d{1,9}$/.test(s || '') ? parseInt(s, 10) : null);
  const scrollUp = uint(params.get('scrollUp')) || 0;
  // sel=開始列,開始行(末尾から),終了列,終了行(末尾から)。4 つそろった非負整数以外は無視
  const selParts = (params.get('sel') || '').split(',').map(uint);
  const sel = selParts.length === 4 && selParts.every((n) => n !== null)
    ? { startX: selParts[0], startFromEnd: selParts[1], endX: selParts[2], endFromEnd: selParts[3] }
    : null;
  // 行の照合用テキスト（本体の先頭表示行 / 選択開始行）。行数の勘定だけでは外れるケースの補正に使う（後述）
  const ANCHOR_MAX = 120;
  const normalizeAnchor = (s) => (s || '').trim().slice(0, ANCHOR_MAX);
  const topAnchor = normalizeAnchor(params.get('top'));
  const selAnchor = normalizeAnchor(params.get('selText'));

  function showMessage(text, isError) {
    const host = $('term');
    host.innerHTML = '';
    const div = document.createElement('div');
    div.id = 'msg';
    if (isError) div.className = 'err';
    div.textContent = text;
    host.appendChild(div);
  }

  if (!/^[0-9a-fA-F-]{36}$/.test(sessionId)) {
    showMessage('セッション ID が指定されていません。', true);
    return;
  }

  fetch('/api/terminal/' + encodeURIComponent(sessionId) + '/snapshot', { cache: 'no-store' })
    .then((r) => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(render)
    .catch((e) => showMessage('取得に失敗しました: ' + (e && e.message ? e.message : e), true));

  function render(data) {
    const cols = data.cols || 120;
    const when = data.capturedAt ? new Date(data.capturedAt) : new Date();
    const whenText = when.toLocaleString();
    document.title = (data.name || 'Terminal') + ' - ' + whenText;
    $('name').textContent = data.name || '';
    $('when').textContent = whenText;
    $('size').textContent = cols + ' x ' + (data.rows || '?');

    const term = new Terminal({
      cursorBlink: false,
      disableStdin: true,
      fontSize: fontSize,
      fontFamily: "TermMix, 'Cascadia Mono', Consolas, monospace",
      scrollback: 10000,
      scrollOnInput: false,
      scrollOnOutput: false,
      scrollOnEraseInDisplay: true,
      theme: {
        background: '#1e1e1e', foreground: '#d4d4d4', cursor: '#1e1e1e',
        black: '#000000', red: '#cd3131', green: '#0dbc79', yellow: '#e5e510',
        blue: '#2472c8', magenta: '#bc3fbc', cyan: '#11a8cd', white: '#e5e5e5',
        brightBlack: '#666666', brightRed: '#f14c4c', brightGreen: '#23d18b',
        brightYellow: '#f5f543', brightBlue: '#3b8eea', brightMagenta: '#d670d6',
        brightCyan: '#29b8db', brightWhite: '#e5e5e5'
      },
      cols: cols,
      rows: data.rows || 30,
      convertEol: false,
      windowsPty: { backend: 'conpty' },
      allowProposedApi: true
    });
    if (typeof window.registerUnicode11Vs16 === 'function') {
      window.registerUnicode11Vs16(term);
    } else if (window.Unicode11Addon) {
      term.loadAddon(new Unicode11Addon.Unicode11Addon());
      term.unicode.activeVersion = '11';
    }
    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open($('term'));

    // 行数だけウィンドウに合わせる（列数は取得時のまま。折り返しを変えない）。
    // 戻り値は先頭から切り捨てられた行数（scrollback 上限に達した状態で行数を減らしたときだけ 0 以外）。
    // xterm は行数変更で選択を消すので、あれば控えておいて切り捨て分をずらして戻す（Codex レビュー P2）。
    function fitRows() {
      const dims = fitAddon.proposeDimensions();
      if (!(dims && dims.rows > 0 && dims.rows !== term.rows)) return 0;
      const buf = term.buffer.active;
      const lengthBefore = buf.length;
      const selPos = term.hasSelection() ? term.getSelectionPosition() : null;
      term.resize(cols, dims.rows);
      const trimmed = Math.max(0, lengthBefore - buf.length);
      if (selPos) {
        const startY = selPos.start.y - trimmed;
        const length = (selPos.end.y * cols + selPos.end.x) - (selPos.start.y * cols + selPos.start.x);
        if (startY >= 0 && length > 0) term.select(selPos.start.x, startY, length);
      }
      return trimmed;
    }

    // 内容は取得時の行数のまま流し込む。直列化の末尾で元のカーソル位置が復元されるが、
    // xterm は行数を減らすときカーソルより下の行を捨てるため、カーソルが上の行にあるまま縮めると
    // 固定したはずの内容が消える（Codex レビュー P2）。流し込み後にカーソルを最下行へ移してから隠し、
    // それが済んでから行数合わせとリサイズ追従を始める。以後、内容は更新しない。
    // 本体のスクロール位置と選択範囲の再現は 2 段階。流し込み直後（取得時の行数のまま）はバッファの形が本体と同じなので
    // ここで「末尾からの行数」を先頭からの絶対行に直し、行数合わせの後に適用する。行数合わせは末尾側で行を
    // 出し入れする（増やすときはスクロールバックから戻す、足りなければ下に空行を足す。減らすときは上へ送る）だけで
    // 先頭からの絶対行は動かない（scrollback 上限に達していて減らすときだけ先頭が切られるので、その分は fitRows が返す）。
    term.write(data.content || '', () => {
      term.write('\x1b[' + term.rows + ';1H\x1b[?25l', () => {
        const target = resolveViewTarget();
        const trimmed = fitRows();
        window.addEventListener('resize', fitRows);
        applyViewTarget(target, trimmed);
      });
    });

    // 期待行 expectedY の近傍で、表示テキストが anchor に一致する行を探す（近い順。見つからなければ expectedY のまま）。
    // 「末尾からの行数」は、本体の xterm が列数変更で履歴を折り返し直している・ピン留めのクリックから取得までに
    // 出力が進んだ、といった場合に本体とずれる（Codex レビュー P2）。行のテキストで照合してその分を補正する。
    const ANCHOR_SEARCH = 60;
    function findAnchorRow(expectedY, anchor) {
      if (!anchor) return expectedY;
      const buf = term.buffer.active;
      const textAt = (y) => {
        const line = y >= 0 && y < buf.length ? buf.getLine(y) : null;
        return line ? normalizeAnchor(line.translateToString(true)) : null;
      };
      for (let d = 0; d <= ANCHOR_SEARCH; d++) {
        if (textAt(expectedY - d) === anchor) return expectedY - d;
        if (d > 0 && textAt(expectedY + d) === anchor) return expectedY + d;
      }
      return expectedY;
    }

    function resolveViewTarget() {
      const buf = term.buffer.active;
      const target = { topLine: null, selection: null };
      if (scrollUp > 0) {
        target.topLine = findAnchorRow(Math.max(0, buf.baseY - scrollUp), topAnchor);
      }
      if (sel && sel.startX < cols && sel.endX <= cols) {
        const startY = findAnchorRow(buf.length - sel.startFromEnd, selAnchor);
        const endY = startY + (sel.startFromEnd - sel.endFromEnd);
        const length = (endY * cols + sel.endX) - (startY * cols + sel.startX);
        if (startY >= 0 && endY < buf.length + (sel.endX === 0 ? 1 : 0) && length > 0) {
          target.selection = { x: sel.startX, y: startY, length };
        }
      }
      return target;
    }

    function applyViewTarget(target, trimmed) {
      if (target.selection) {
        term.select(target.selection.x, target.selection.y - trimmed, target.selection.length);
      }
      if (target.topLine !== null) {
        term.scrollToLine(Math.max(0, Math.min(target.topLine - trimmed, term.buffer.active.baseY)));
      } else {
        term.scrollToBottom();
      }
    }
  }
})();
</script>
</body>
</html>
